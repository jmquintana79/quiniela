<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Predictions</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
<main>
  <header>
    <h1>Predictions</h1>
    <span class="meta" id="meta"></span>
  </header>

  <section class="card" style="margin-bottom:16px">
    <h2>Season so far</h2>
    <div class="tiles" id="totals"></div>
  </section>

  <section class="card" style="margin-bottom:16px">
    <h2>Matchdays</h2>
    <div class="scroll" id="overview"></div>
    <p class="meta" style="margin:10px 0 0">Click a matchday to open it below.</p>
  </section>

  <div class="filters">
    <label>Matchday <select id="matchday"></select></label>
    <span class="meta" id="matchday-dates"></span>
  </div>

  <section style="margin-bottom:8px" id="banners"></section>

  <section class="card">
    <h2 id="matches-title">Matches</h2>
    <div class="scroll" id="matches"></div>
    <p class="meta" style="margin:10px 0 0">
      Ticket: the 14 matches used for the quiniela check (La Liga first, then Segunda, in
      kick-off order). Prizes: 14 hits 1st, 13 2nd, 12 3rd, 11 4th, 10 5th category; the
      Pleno al 15 is not simulated.
    </p>
  </section>
</main>

<script>const DATA = /*__DATA__*/null;</script>
<script>/*__SCRIPT__*/</script>
<script>
  const SIGN = { H: "1", D: "X", A: "2" };
  const $ = (id) => document.getElementById(id);
  const models = DATA.models;
  let selected = DATA.matchdays.length - 1;

  // Prediction cell: green check for a hit, red cross for a miss, outline when pending
  function pickCell(match, key) {
    const sign = match[`${key}_sign`];
    if (!sign) return '<span class="muted">–</span>';
    const prob = match[`${key}_prob`];
    const tip = `Predicted ${SIGN[sign]} (${pct(prob, 1)})`;
    if (!match.FTR) return `<span class="pick pending" data-tip="${tip}">${SIGN[sign]}</span>`;
    const hit = sign === match.FTR;
    return `<span class="pick ${hit ? "hit" : "miss"}" data-tip="${tip} · ${hit ? "hit" : "miss"}">` +
      `${SIGN[sign]} ${hit ? "✓" : "✗"}</span>`;
  }

  function totalsTiles() {
    if (!models.length) return '<p class="empty">No predictions yet. Run <code>invoke predict.all</code>.</p>';
    return models.map((m) => {
      const t = DATA.totals[m.key];
      return `<div class="tile" data-tip="${esc(m.description)}">
        <div class="label">${esc(m.name)}</div>
        <div class="value">${pct(t.rate, 1)}</div>
        <div class="detail">${t.hits} hits · ${t.misses} misses</div>
        <div class="detail">Prizes: ${t.prizes} of ${t.tickets} complete tickets</div>
      </div>`;
    }).join("");
  }

  function prizeBadge(ticket) {
    if (ticket.status === "prize") return `<span class="badge prize">${esc(ticket.category)}</span>`;
    if (ticket.status === "no_prize") return '<span class="badge">No prize</span>';
    if (ticket.status === "pending") return '<span class="badge">Pending</span>';
    return '<span class="badge">No ticket</span>';
  }

  function overviewTable() {
    return `<table><thead><tr>
        <th class="num">#</th><th>Dates</th><th class="num">Played</th>
        ${models.map((m) => `<th class="num">${esc(m.name)}</th><th>Quiniela</th>`).join("")}
      </tr></thead><tbody>${DATA.matchdays.map((md, i) => `<tr class="clickable ${i === selected ? "selected" : ""}" data-i="${i}">
        <td class="num">${md.number}</td>
        <td class="muted">${fmtDate(md.start)} – ${fmtDate(md.end)}</td>
        <td class="num">${md.played}/${md.matches.length}</td>
        ${models.map((m) => {
          const s = md.summary[m.key];
          const played = s.hits + s.misses;
          return `<td class="num">${played ? `${s.hits}/${played}` : "–"}</td><td>${prizeBadge(s.ticket)}</td>`;
        }).join("")}
      </tr>`).join("")}</tbody></table>`;
  }

  function banners(md) {
    return models.map((m) => {
      const t = md.summary[m.key].ticket;
      const title = {
        prize: `Quiniela prize: ${t.category}`,
        no_prize: "Quiniela: no prize",
        pending: "Quiniela: matchday in progress",
        incomplete: "Quiniela: no full ticket",
      }[t.status];
      return `<div class="banner ${t.status}"><strong>${esc(m.name)} · ${title}</strong>${esc(t.message)}</div>`;
    }).join("");
  }

  function matchesTable(md) {
    const result = (m) => m.FTR
      ? `<span class="strong">${m.FTHG} – ${m.FTAG}</span> <span class="muted">(${SIGN[m.FTR]})</span>`
      : '<span class="muted">Pending</span>';
    const footer = models.map((m) => {
      const s = md.summary[m.key];
      return `<td class="num">${s.hits} ✓ · ${s.misses} ✗${s.pending ? ` · ${s.pending} pending` : ""}</td>`;
    }).join("");
    return `<table><thead><tr>
        <th class="num">Ticket</th><th>League</th><th>Kick-off</th><th class="num">Home</th><th>Away</th>
        <th>Result</th>${models.map((m) => `<th class="num" data-tip="${esc(m.description)}">${esc(m.name)}</th>`).join("")}
      </tr></thead><tbody>${md.matches.map((m) => `<tr>
        <td class="num muted">${m.ticket ?? ""}</td>
        <td class="muted">${esc(DATA.leagues[m.league] ?? m.league)} · R${m.round}</td>
        <td class="muted">${fmtDate(m.date, true)}</td>
        <td class="num strong">${esc(m.home_team)}</td><td class="strong">${esc(m.away_team)}</td>
        <td>${result(m)}</td>
        ${models.map((model) => `<td class="num">${pickCell(m, model.key)}</td>`).join("")}
      </tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="6">Total</td>${footer}</tr></tfoot></table>`;
  }

  function select(i) {
    selected = i;
    const md = DATA.matchdays[i];
    $("matchday").value = i;
    $("matchday-dates").textContent = `${fmtDate(md.start)} – ${fmtDate(md.end)}`;
    $("matches-title").textContent = `Matchday ${md.number}`;
    $("banners").innerHTML = banners(md);
    $("matches").innerHTML = matchesTable(md);
    $("overview").innerHTML = overviewTable();
    $("overview").querySelectorAll("tr.clickable").forEach((row) =>
      row.addEventListener("click", () => select(Number(row.dataset.i))));
  }

  $("totals").innerHTML = totalsTiles();
  if (DATA.matchdays.length) {
    $("meta").textContent = `Current season · ${DATA.matchdays.length} matchdays`;
    $("matchday").innerHTML = DATA.matchdays.map((md, i) =>
      `<option value="${i}">${md.number}</option>`).join("");
    $("matchday").addEventListener("change", (e) => select(Number(e.target.value)));
    select(selected);
  } else {
    $("meta").textContent = "No current season data. Run invoke download.current first.";
  }
</script>
</body>
</html>
