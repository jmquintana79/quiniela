<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Current Matchday</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Current matchday</h1>
    <span class="meta" id="meta"></span>
  </header>

  <section class="block">
    <div id="status"></div>
    <div id="banners" style="margin-bottom:8px"></div>
    <div class="card">
      <h2 id="matches-title">Matches</h2>
      <div class="filters"><span class="meta">Order</span><div class="segmented" id="sort-switch"></div></div>
      <div class="scroll" id="matches"></div>
      <p class="meta" style="margin:10px 0 0" id="legend"></p>
      <p class="meta" style="margin:6px 0 0" id="odds"></p>
    </div>
  </section>

  <section class="block">
    <h2 class="section-title">Standings</h2>
    <div class="filters"><div class="segmented" id="league-switch"></div></div>
    <div class="card"><div class="scroll" id="standings"></div></div>
  </section>

  <p class="meta">Every matchday of the season, with the totals of each model:
    <a href="season.html">season.html</a>.</p>
</main>

<script>const DATA = /*__DATA__*/null;</script>
<script>/*__SCRIPT__*/</script>
<script>
  const $ = (id) => document.getElementById(id);
  const md = DATA.matchday;
  const SORTS = ["ticket", "confidence"];
  let sort = "ticket";

  function showMatches() {
    $("matches").innerHTML = DATA.models.length
      ? matchdayTable(md, DATA.models, DATA.leagues, DATA.confidence_model, DATA.confidence_tiers, sort)
      : '<p class="empty">No predictions yet. Run <code>invoke update</code>.</p>';
  }

  // What the current matchday is, so a finished or unpublished one is never mistaken
  function statusBanner() {
    const left = md.matches.length - md.played;
    const text = {
      upcoming: ["Upcoming matchday", "No match has been played yet: every column is a prediction."],
      in_progress: ["Matchday in progress", `${md.played} of ${md.matches.length} matches played, ${left} still to play.`],
      completed: ["Matchday completed", "Every match of this matchday has been played. The next matchday " +
        "is not published by the source yet (a few days before it is played, later during " +
        "international breaks): run <code>invoke update</code> again closer to it."],
    }[DATA.status];
    return `<div class="banner ${DATA.status === "completed" ? "" : "pending"}"><strong>${text[0]}</strong>${text[1]}</div>`;
  }

  function showStandings(i) {
    const code = Object.keys(DATA.standings)[i];
    $("standings").innerHTML = standingsTable(DATA.standings[code]);
  }

  $("legend").innerHTML = MATCHDAY_LEGEND;
  if (md) {
    $("title").textContent = `Matchday ${md.number}`;
    $("meta").textContent = `${fmtDate(md.start)} – ${fmtDate(md.end)} · current season, ${DATA.matchdays} matchdays so far`;
    $("matches-title").textContent = `Matches and predictions · ${md.played}/${md.matches.length} played`;
    $("status").innerHTML = statusBanner();
    $("banners").innerHTML = DATA.models.length ? quinielaBanners(md, DATA.models) : "";
    segmented($("sort-switch"), ["Ticket order", "Most predictable first"], 0, (i) => { sort = SORTS[i]; showMatches(); });
    showMatches();
    $("odds").innerHTML = DATA.odds_downloaded
      ? `Market odds as downloaded on ${fmtDate(DATA.odds_downloaded, true)}; they keep moving until kick-off.`
      : "";
  } else {
    $("meta").textContent = "No current season data. Run invoke update first.";
  }

  const codes = Object.keys(DATA.standings);
  if (codes.length) {
    segmented($("league-switch"), codes.map((c) => DATA.leagues[c] ?? c), 0, showStandings);
    showStandings(0);
  }
</script>
</body>
</html>
